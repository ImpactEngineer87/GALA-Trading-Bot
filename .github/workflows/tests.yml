name: Trading bot regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests with external networking disabled
        shell: bash
        run: |
          sudo unshare --net -- runuser -u "$USER" -- "$(command -v python)" -m unittest discover -s tests 2>&1 | tee regression.log
      - name: Save regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: regression.log
